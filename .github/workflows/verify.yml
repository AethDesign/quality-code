name: Verify toolkit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/verify_docs.py
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]] || ! git diff --quiet --no-ext-diff --no-textconv --no-renames "$BASE" HEAD -- .github/workflows scripts/verify_docs.py; then
            profile=full
          else
            profile=$(python3 -B scripts/verify_docs.py --ci --base "$BASE" --head HEAD)
          fi
          case "$profile" in
            docs|full) echo "profile=$profile" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected verification profile" >&2; exit 1 ;;
          esac
          echo "Verification profile: $profile"
  verify:
    needs: scope
    if: needs.scope.outputs.profile != 'docs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ./quality validate
      - run: ./quality verify full
